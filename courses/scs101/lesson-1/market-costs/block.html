<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Construction decisions and their costs — SCS101 Lesson 1</title>
<style>
/* EMBED_FONTS */
/* EMBED_FOUNDATION */
*{box-sizing:border-box}
body{margin:0;padding:8px 4px;color:var(--gw-text);background:transparent;font:var(--gw-text-m)/var(--gw-leading-normal) var(--gw-font-body)}
figure{max-width:960px;margin:auto;padding:16px 20px;background:var(--gw-surface);border-radius:var(--gw-radius-xl)}
h2{font:700 var(--gw-text-l)/var(--gw-leading-tight) var(--gw-font-heading);letter-spacing:-.025em;margin:0 0 6px}
p{margin:0}
.origin{position:relative;max-width:440px;margin:0 auto;padding:16px 20px;border-radius:var(--gw-radius-l);background:var(--gw-brand);color:var(--gw-on-brand)}
.origin::after{content:'';position:absolute;top:100%;height:20px;left:50%;border-left:2px solid var(--gw-border-control)}
.groups{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:32px;list-style:none;margin:20px 0 0;padding:0}
.groups::before{content:'';position:absolute;left:calc(25% - 8px);right:calc(25% - 8px);top:0;border-top:2px solid var(--gw-border-control)}
.groups li{position:relative;padding:32px 4px 0;min-width:0}
.groups li::before{content:'';position:absolute;left:50%;top:0;height:18px;border-left:2px solid var(--gw-border-control)}
.groups li::after{content:'';position:absolute;left:calc(50% - 4px);top:11px;width:10px;height:10px;border-bottom:2px solid var(--gw-border-control);border-right:2px solid var(--gw-border-control);transform:rotate(45deg)}
.groups h2{color:var(--gw-brand)}
@media(max-width:520px){figure{padding:16px}.origin{max-width:none;padding:16px 20px}.origin::after{left:16px;height:32px}.groups{grid-template-columns:1fr;gap:24px;margin-top:32px;padding-left:40px}.groups::before{left:16px;right:auto;top:0;bottom:0;border-top:0;border-left:2px solid var(--gw-border-control)}.groups li{padding:0 0 0 0}.groups li::before{left:-24px;top:12px;width:12px;height:0;border-left:0;border-top:2px solid var(--gw-border-control)}.groups li::after{left:-19px;top:8px;transform:rotate(-45deg)}.groups::before{display:none}.branch{position:absolute;left:-24px;top:-24px;bottom:-24px;border-left:2px solid var(--gw-border-control)}.groups li:first-child .branch{top:-32px}.groups li:last-child .branch{bottom:auto;height:36px} }
</style></head>
<body>
<figure aria-label="Construction decisions can transfer costs to other people">
<div class="origin"><h2>Builders and developers</h2><p>Financial incentive to minimize upfront construction costs.</p></div>
<ul class="groups" role="list" aria-label="Groups that may bear the costs and consequences">
<li><span class="branch" aria-hidden="true"></span><h2>Future owners and tenants</h2><p>Higher utility bills, hidden safety hazards and expensive repairs.</p></li>
<li><span class="branch" aria-hidden="true"></span><h2>Broader community</h2><p>Costs associated with major fires, emergency responses and carbon emissions.</p></li>
</ul>
</figure>
</body></html>
