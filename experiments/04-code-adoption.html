<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model codes and Alberta legal adoption · Groundwork</title>
<style>
@font-face{font-family:Archivo;src:url('fonts/archivo-latin-700-normal.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Atkinson Hyperlegible Next';src:url('fonts/atkinson-hyperlegible-next-latin-400-normal.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Atkinson Hyperlegible Next';src:url('fonts/atkinson-hyperlegible-next-latin-700-normal.woff2') format('woff2');font-weight:700;font-display:swap}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#1d2030;font:18px/1.5 'Atkinson Hyperlegible Next','Segoe UI',sans-serif}
main{max-width:1140px;margin:auto;padding:32px}
h1,h2,h3{font-family:Archivo,'Segoe UI',sans-serif;letter-spacing:-.025em;line-height:1.2}
h1{font-size:26px;margin:0 0 20px}
h2{font-size:23px;margin:8px 0 6px}
p{margin:0}
.diagram{margin:0;background:#e7edf4;border-radius:22px;padding:20px}
.comparison{display:grid;grid-template-columns:minmax(0,1fr) 88px minmax(0,1.2fr);align-items:stretch}
.national,.law{padding:20px;border-radius:16px;background:#fff;box-shadow:0 3px 12px #19385b09}
.label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#104c8f}
.national{display:flex;flex-direction:column;align-items:flex-start}
.model-heading{display:flex;align-items:center;gap:12px;margin:14px 0 12px}
.model-heading h2{margin:0}
.model-icon{width:40px;height:44px;flex-shrink:0}
.national p,.law>p{font-size:17px;color:#505769}
.distinction{display:inline-block;margin-top:auto;padding:6px 16px;border-radius:30px;background:#fbefc6;color:#775316;font-size:16px;font-weight:700}
.national p{margin-bottom:20px}
.connector{align-self:end;margin-bottom:43px;padding:0 10px;color:#104c8f;text-align:center;font-size:13px;line-height:1.3}
.connector span{display:block;margin-bottom:9px}
.connector i{display:block;height:2px;background:currentColor;position:relative}
.connector i:after{content:'';position:absolute;right:0;top:-4px;width:8px;height:8px;border:solid currentColor;border-width:2px 2px 0 0;transform:rotate(45deg)}
.under-act{display:flex;align-items:center;gap:10px;height:32px;padding-left:18px;color:#104c8f;font-size:14px}
.under-act:before{content:'';display:block;align-self:stretch;width:2px;background:currentColor}
.adoption{position:relative;padding:14px 18px;border-radius:10px;background:#104c8f;color:#fff}
.adoption:before{content:'';position:absolute;top:-9px;left:14px;width:8px;height:8px;border:solid #104c8f;border-width:0 2px 2px 0;transform:rotate(45deg)}
.adoption h3{font-size:20px;margin:0}
.requirements{margin-top:18px}
.requirements p{font-size:17px;font-weight:700}
.requirements ul{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.requirements li{padding:12px 16px;border-radius:10px;background:#f8fafc;text-align:center;font:700 18px/1.3 Archivo,'Segoe UI',sans-serif;color:#104c8f}
@media(max-width:780px){
 main{padding:24px 16px}
 h1{font-size:24px;margin-bottom:18px}
 .diagram{padding:16px;border-radius:18px}
 .comparison{grid-template-columns:1fr;gap:16px}
 .national,.law{padding:18px}
 .connector{display:none}
 .model-heading{margin:12px 0 10px}
 .model-heading h2,.law h2{font-size:22px}
 .model-icon{width:34px;height:38px}
 .distinction{margin-top:0}
 .requirements ul{gap:8px}
 .requirements li{font-size:16px;padding:12px 8px}
}
@media(max-width:430px){.requirements ul{grid-template-columns:1fr}.requirements li{text-align:left;padding:10px 14px}}
</style>
</head>
<body>
<main>
<h1 id="diagram-title">Model code development and legal adoption</h1>
<figure class="diagram" aria-labelledby="diagram-title">
<div class="comparison">
<section class="national" aria-labelledby="model-title">
<span class="label">National development</span>
<div class="model-heading">
<svg class="model-icon" viewBox="0 0 44 48" aria-hidden="true">
 <rect x="3" y="4" width="38" height="40" rx="10" fill="#e7edf4"/>
 <rect x="10" y="5" width="25" height="30" rx="2" fill="#fff"/>
 <path d="M10 5h25v30H13a5 5 0 0 0 0 10h22M10 5v31M14 40h17M16 16h12M16 22h12M16 28h8" fill="none" stroke="#104c8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="M27 5v10l3-2 3 2V5" fill="#d9866b"/>
</svg>
<h2 id="model-title">National model codes</h2>
</div>
<p>Provide a technical model.</p>
<strong class="distinction">Not automatically law</strong>
</section>
<div class="connector" aria-hidden="true"><span>Technical<br>model</span><i></i></div>
<section class="law" aria-labelledby="act-title">
<span class="label">Alberta legal adoption</span>
<h2 id="act-title">Safety Codes Act</h2>
<p>Establishes the legislative framework.</p>
<div class="under-act">Under the Act</div>
<section class="adoption" aria-labelledby="regulations-title">
<h3 id="regulations-title">Regulations adopt applicable codes</h3>
</section>
</section>
</div>
<div class="requirements">
<p>Applicable legal requirements depend on:</p>
<ul aria-label="Factors determining applicable legal requirements">
<li>Adopted edition</li>
<li>Amendments</li>
<li>Effective dates</li>
</ul>
</div>
</figure>
</main>
</body>
</html>
