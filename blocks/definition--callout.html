<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Definition — callout</title>
<!--
  Library block: definition callout (from Groundwork for Rise preset definition--callout).
  A short official definition set apart inside reading content. Static; nothing to select.
  Groundwork look: borderless ice card; on an ice section use class="defc is-white". For a definition learners explore, use definition--key-term.
  Pack for Rise: bun tools/pack.ts blocks/definition--callout.html
-->
<style>
  /* Plain, non-clickable definition inside reading content: borderless ice card. On an ice section use class="defc is-white". */
  .defc { background: var(--gw-ice); padding: 22px 28px 24px; display: grid; gap: var(--wa-space-xs); }
  .defc.is-white { background: var(--gw-white); }
  .defc-label { display: flex; align-items: center; gap: 6px; font-size: 0.8125rem; color: var(--gw-label-grey); }
  .defc-label wa-icon { font-size: 16px; margin-inline-start: -2px; }
  .defc dl { margin: 0; display: grid; gap: var(--wa-space-2xs); }
  .defc dt { font-family: var(--wa-font-family-heading); font-weight: 700; font-size: 1.25rem; line-height: 1.35; }
  .defc dd { margin: 0; }
  @media (max-width: 600px) { .defc { padding: var(--wa-space-m) var(--wa-space-l); } }
</style>
</head>
<body>
<section class="gw-block" aria-label="Definition">
  <div class="defc">
    <p class="defc-label gw-eyebrow"><wa-icon name="bookmark"></wa-icon>Definition</p>
    <dl>
      <dt>Term</dt>
      <dd>A short, official definition of the term, set apart from the surrounding reading so it is easy to find again.</dd>
    </dl>
  </div>
</section>
</body>
</html>
