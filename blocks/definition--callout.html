<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Definition — callout</title>
<!--
  Library block: definition callout (from Groundwork for Rise preset definition--callout).
  A plain, non-clickable definition inside reading content, set apart so it is easy to find again.
  Plum tint surface (definitions carry the plum hue; see definition--key-term). Works on white and ice.
  Static block: no completion.
  Pack for Rise: bun tools/pack.ts blocks/definition--callout.html
-->
<style>
  .defc { background: var(--hue-tint); border-radius: var(--wa-border-radius-l); padding: 18px 24px 20px; display: grid; gap: 6px; }
  .defc-label { display: flex; align-items: center; gap: 8px; color: var(--hue-deep); }
  .defc-label wa-icon { font-size: 16px; }
  .defc dl { margin: 0; display: grid; gap: 4px; }
  .defc dt { font-family: var(--wa-font-family-heading); font-weight: 700; font-size: 1.25rem; letter-spacing: -0.02em; line-height: 1.25; }
  .defc dd { margin: 0; line-height: 1.55; max-width: 48em; }
  @media (max-width: 600px) { .defc { padding: 16px 18px 18px; } }
</style>
</head>
<body>
<section class="gw-block" aria-label="Definition">
  <div class="defc gw-hue-plum">
    <p class="defc-label gw-eyebrow"><wa-icon name="bookmark"></wa-icon>Definition</p>
    <dl>
      <dt>Term</dt>
      <dd>A short, official definition of the term, set apart from the surrounding reading so it is easy to find again.</dd>
    </dl>
  </div>
</section>
</body>
</html>
