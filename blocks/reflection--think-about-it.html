<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Think about it</title>
<!--
  Library block: Think about it (from Groundwork for Rise preset reflection--think-about-it).
  A big opening question at the start of a lesson or module, not for questions inside reading content.
  Designed to sit on an ice section: white card, 1px outline, ink icon. Static.
  Pack for Rise: bun tools/pack.ts blocks/reflection--think-about-it.html
-->
<style>
  /* White card with a 1px outline, on an ice section. Ink line icon, no tile. */
  .think { background: var(--gw-white); border: 1px solid var(--gw-border); padding: 30px 34px 32px; display: grid; gap: 18px; }
  .think-label { display: flex; align-items: center; gap: 10px; letter-spacing: 0.08em; }
  .think-label wa-icon { font-size: 28px; }
  .think-q { font-size: 1.375rem; line-height: 1.3; }
  .think-prompt { margin-block-start: -10px; }
  .think-next { display: flex; align-items: flex-start; gap: 14px; margin-block-start: 6px; padding-block-start: 20px; border-block-start: 1px solid var(--gw-line); line-height: 1.55; }
  .think-next wa-icon { font-size: 18px; flex: none; margin-block-start: 4px; }
  @media (max-width: 600px) { .think { padding: var(--wa-space-l); gap: var(--wa-space-m); } .think-prompt { margin-block-start: -6px; } }
</style>
</head>
<body>
<section class="gw-block" aria-labelledby="think-q">
  <div class="think">
    <p class="think-label gw-eyebrow"><wa-icon name="circle-question-mark"></wa-icon>Think about it</p>
    <div>
      <h2 class="think-q" id="think-q">Where have you encountered code requirements in your work?</h2>
    </div>
    <p class="think-prompt">Think of a specific example, and what it asked of you.</p>
    <p class="think-next"><wa-icon name="arrow-right"></wa-icon><span>Keep your answer in mind as you continue.</span></p>
  </div>
</section>
</body>
</html>
