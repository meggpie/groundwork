<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Think about it</title>
<!--
  Library block: Think about it (from Groundwork for Rise preset reflection--think-about-it).
  A big opening question at the start of a lesson or module, designed to sit on an ice section.
  Static block: no completion.
  Pack for Rise: bun tools/pack.ts blocks/reflection--think-about-it.html
-->
<style>
  .think { display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 16px; row-gap: 6px;
    background: var(--gw-white); border-radius: var(--wa-border-radius-l); box-shadow: var(--wa-shadow-l); padding: 18px 20px; }
  .think-icon { grid-row: 1 / span 3; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
    background: var(--hue-tint); color: var(--hue-deep); font-size: 22px; }
  .think .gw-eyebrow { color: var(--hue-deep); margin-block-start: 2px; }
  .think-q { font-size: 1.5rem; letter-spacing: -0.03em; line-height: 1.2; max-width: 24em; }
  .think-prompt { font-size: 1.0625rem; color: var(--gw-quiet); }
  .think-next { grid-column: 2; display: flex; align-items: center; gap: 10px; margin-block-start: 6px;
    padding-block-start: 10px; border-block-start: 1px solid var(--gw-line); color: var(--gw-ink); font-weight: 700; }
  .think-next wa-icon { color: var(--hue-deep); flex: none; }

  @media (max-width: 600px) {
    .think { grid-template-columns: 40px minmax(0, 1fr); column-gap: 12px; padding: 16px; }
    .think-icon { grid-row: 1; width: 40px; height: 40px; font-size: 20px; }
    .think .gw-eyebrow { align-self: center; margin: 0; }
    .think-q, .think-prompt { grid-column: 1 / -1; }
    .think-q { font-size: 1.3125rem; }
    .think-next { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<section class="gw-block" aria-labelledby="think-q">
  <div class="think gw-hue-coral">
    <span class="think-icon"><wa-icon name="message-circle-question-mark"></wa-icon></span>
    <p class="gw-eyebrow">Think about it</p>
    <h2 class="think-q" id="think-q">Where have you encountered code requirements in your work?</h2>
    <p class="think-prompt">Think of a specific example, and what it asked of you.</p>
    <p class="think-next"><wa-icon name="arrow-right"></wa-icon><span>Keep your answer in mind as you continue.</span></p>
  </div>
</section>
</body>
</html>
