<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson header — hexagons</title>
<!--
  Groundwork block: lesson header. Dark blue band with the lesson label and title; the gold tab and outline
  hexagons are the only place the hexagon motif appears. Place it in a dark blue Rise section.
  Source preset: groundwork-for-rise library/presets/lesson-header--hexagons.json
  Static: no completion.
  Pack for Rise: bun tools/pack.ts blocks/lesson-header--hexagons.html
-->
<style>
  html { background: var(--gw-dark-blue); }
  .lh { position: relative; overflow: hidden; background: var(--gw-dark-blue); min-height: 240px; display: flex; flex-direction: column; justify-content: center; gap: var(--wa-space-s); padding: 72px 64px 76px 104px; }
  .lh-tab { position: absolute; left: 0; top: 50%; width: 64px; height: 136px; translate: 0 -50%; }
  .lh-tab polygon { fill: var(--gw-gold); }
  .lh-hex { position: absolute; right: 24px; top: 50%; width: 320px; height: 420px; translate: 0 -50%; }
  .lh-hex polygon { fill: none; stroke: var(--gw-hex-line); stroke-width: 22; stroke-linejoin: round; }
  .lh-label, .lh h1 { position: relative; }
  .lh-label { font-family: var(--wa-font-family-heading); font-weight: 700; font-size: 0.9375rem; color: var(--wa-color-brand-80); }
  .lh h1 { color: var(--gw-white); font-size: clamp(1.75rem, 3.6vw, 2.125rem); line-height: 1.12; letter-spacing: -0.03em; max-width: 620px; }

  @media (max-width: 760px) {
    .lh { min-height: 200px; padding: 52px 28px 56px 76px; }
    .lh-tab { width: 48px; height: 102px; }
    .lh-hex { right: -130px; }
  }
  @media (max-width: 480px) {
    .lh { min-height: 180px; padding: 44px 20px 48px 60px; }
  }
</style>
</head>
<body>
<section class="gw-block">
  <header class="lh">
    <svg class="lh-tab" viewBox="0 0 64 136" aria-hidden="true" focusable="false"><polygon points="0,0 39,0 64,68 39,136 0,136"/></svg>
    <svg class="lh-hex" viewBox="0 0 320 420" aria-hidden="true" focusable="false">
      <!-- two outline hexagons stacked edge to edge -->
      <polygon points="40,80 100,-24 220,-24 280,80 220,184 100,184"/>
      <polygon points="40,288 100,184 220,184 280,288 220,392 100,392"/>
    </svg>
    <p class="lh-label">Lesson 1</p>
    <h1>Lesson title</h1>
  </header>
</section>
</body>
</html>
