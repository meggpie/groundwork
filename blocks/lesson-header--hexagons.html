<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson header — hexagons</title>
<!--
  Groundwork block: lesson header. Dark blue band with the lesson label and title; the gold tab and outline
  hexagons are the only place the hexagon motif appears. Place it in a dark blue Rise section.
  Source preset: groundwork-for-rise library/presets/lesson-header--hexagons.json. Static: no completion.
  Pack for Rise: bun tools/pack.ts blocks/lesson-header--hexagons.html
-->
<style>
  html { background: var(--gw-dark-blue); }
  .lh { position: relative; overflow: hidden; background: var(--gw-dark-blue); min-height: 168px; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 40px 64px 42px 84px; }
  .lh-tab { position: absolute; left: 0; top: 50%; width: 44px; height: 88px; translate: 0 -50%; }
  .lh-tab polygon { fill: var(--gw-gold); }
  .lh-hex { position: absolute; right: 24px; top: 50%; width: 300px; height: 250px; translate: 0 -50%; }
  .lh-hex polygon { fill: none; stroke: var(--gw-hex-line); stroke-width: 10; stroke-linejoin: round; }
  .lh-hex polygon.solid { fill: var(--gw-hex-line); stroke: none; opacity: 0.55; }
  .lh-label, .lh h1 { position: relative; }
  .lh-label { font-weight: 700; font-size: 0.8125rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gw-header-label); }
  .lh h1 { color: var(--gw-white); font-size: clamp(1.875rem, 3.8vw, 2.375rem); line-height: 1.1; letter-spacing: -0.035em; max-width: 600px; }

  @media (max-width: 760px) {
    .lh { min-height: 148px; padding: 32px 28px 34px 64px; }
    .lh-tab { width: 36px; height: 72px; }
    .lh-hex { right: -150px; }
  }
  @media (max-width: 480px) {
    .lh { min-height: 132px; padding: 28px 20px 30px 54px; }
    .lh-hex { display: none; }
  }
</style>
</head>
<body>
<section class="gw-block">
  <header class="lh">
    <svg class="lh-tab" viewBox="0 0 52 104" aria-hidden="true" focusable="false"><polygon points="0,0 22,0 52,52 22,104 0,104"/></svg>
    <svg class="lh-hex" viewBox="0 0 360 300" aria-hidden="true" focusable="false">
      <!-- a small honeycomb of outline hexagons, one quietly filled -->
      <polygon points="110,40 170,40 200,92 170,144 110,144 80,92"/>
      <polygon class="solid" points="200,92 260,92 290,144 260,196 200,196 170,144"/>
      <polygon points="110,144 170,144 200,196 170,248 110,248 80,196"/>
      <polygon points="290,40 350,40 380,92 350,144 290,144 260,92"/>
    </svg>
    <p class="lh-label">Lesson 1</p>
    <h1>Lesson title</h1>
  </header>
</section>
</body>
</html>
