<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon list — panel</title>
<!--
  Groundwork block: icon list, "panel" layout. One soft rounded surface holding the list, with dividers between items.
  Each item takes a hue class (gw-hue-blue, -coral, -plum, -jade, -cobalt): icon in the deep hue on a tint tile.
  Use a restrained set and keep the order meaningful; one hue for every item is fine when items are alike.
  Source preset: groundwork-for-rise library/presets/icon-grid--panel.json. Static: no completion.
  Pack for Rise: bun tools/pack.ts blocks/icon-grid--panel.html
-->
<style>
  /* Icon list family: each item carries its own hue (DESIGN.md colour roles; experiments/01-model-codes). */
  .ig { list-style: none; margin: 0; padding: 0; }
  .ig-item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 14px; align-items: start; min-width: 0; }
  .ig-icon { display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--wa-border-radius-m); background: var(--hue-tint); color: var(--hue-deep); font-size: 22px; line-height: 0; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--hue) 22%, transparent); }
  .ig-title { font-size: 1.125rem; margin-block: 1px 2px; }
  .ig-text { color: var(--wa-color-text-quiet); }
  @media (max-width: 600px) { .ig-icon { width: 40px; height: 40px; font-size: 20px; } }
  wa-card.ig-panel { --spacing: 16px 20px; box-shadow: var(--wa-shadow-l); }
  .ig--panel > li { padding-block: 12px; }
  .ig--panel > li:first-child { padding-block-start: 0; }
  .ig--panel > li:last-child { padding-block-end: 0; }
  .ig--panel > li + li { border-block-start: 1px solid var(--gw-line); }
  .ig--panel .ig-item { align-items: center; }
  .ig--panel .ig-title { margin-block-start: 0; }
  @media (max-width: 600px) { wa-card.ig-panel { --spacing: 14px 16px; } }
</style>
</head>
<body>
<section class="gw-block">
  <wa-card class="ig-panel">
  <ul class="ig ig--panel" aria-label="Key ideas">
    <li class="ig-item gw-hue-blue">
      <span class="ig-icon"><wa-icon name="drafting-compass"></wa-icon></span>
      <div><h3 class="ig-title">Plan</h3><p class="ig-text">Set out what needs to happen and why.</p></div>
    </li>
    <li class="ig-item gw-hue-coral">
      <span class="ig-icon"><wa-icon name="scroll-text"></wa-icon></span>
      <div><h3 class="ig-title">Design</h3><p class="ig-text">Work out the details before work starts.</p></div>
    </li>
    <li class="ig-item gw-hue-plum">
      <span class="ig-icon"><wa-icon name="hard-hat"></wa-icon></span>
      <div><h3 class="ig-title">Build</h3><p class="ig-text">Put the plan into practice.</p></div>
    </li>
    <li class="ig-item gw-hue-jade">
      <span class="ig-icon"><wa-icon name="badge-check"></wa-icon></span>
      <div><h3 class="ig-title">Check</h3><p class="ig-text">Confirm the result meets the standard.</p></div>
    </li>
  </ul>
  </wa-card>
</section>
</body>
</html>
