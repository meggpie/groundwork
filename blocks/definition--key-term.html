<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Definition — Checklist</title>
<!--
  Library block: key-term definition (from Groundwork for Rise preset definition--key-term).
  The term is the heading; the marked words in the definition are buttons that open a short explanation below.
  White card with a soft shadow (works on white and ice); definitions carry the plum hue (see definition--callout).
  Marked words are interactive, so they use dark blue.
  Completes when every marked word has been opened.
  To reuse: change the term and definition, and give each <button class="def-sub" data-term="id"> a matching
  <template data-term="id"> with its heading and explanation.
  Pack for Rise: bun tools/pack.ts blocks/definition--key-term.html
-->
<style>
  .def { background: var(--gw-white); border: 1px solid var(--gw-border); border-radius: var(--wa-border-radius-l); box-shadow: var(--wa-shadow-l);
    padding: 16px 20px 18px; display: grid; gap: 8px; }
  .def-label { display: flex; align-items: center; gap: 8px; color: var(--hue-deep); }
  .def-label wa-icon { font-size: 16px; }
  .def-term { font-size: 1.5rem; letter-spacing: -0.02em; }
  .def-text { line-height: 1.6; max-width: 48em; }
  .def-more { color: var(--gw-quiet); }

  /* Marked words: clearly clickable inline buttons (dark blue, dotted underline); open = blue tint. */
  .def-sub {
    display: inline; margin: 0; padding: 0 3px; border: 0; border-radius: 4px; background: none;
    color: var(--gw-dark-blue); font: inherit; font-weight: 700; cursor: pointer;
    text-decoration: underline 2px dotted; text-underline-offset: 4px;
  }
  .def-sub:hover { background: var(--gw-blue-tint); text-decoration-style: solid; }
  .def-sub[aria-expanded="true"] { background: var(--gw-blue-tint); text-decoration-style: solid; }

  .def-panel { background: var(--hue-tint); border-radius: var(--wa-border-radius-m); padding: 12px 16px 14px;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; row-gap: 4px; align-items: start; }
  .def-panel[hidden] { display: none; }
  .def-panel h3 { font-size: 1.125rem; line-height: 1.3; outline: none; }
  .def-panel p { grid-column: 1; line-height: 1.55; }
  .def-panel wa-button { grid-row: 1 / span 2; grid-column: 2; margin: -8px -10px 0 0; font-size: 1.125rem; }

  .def-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px;
    padding-block-start: 10px; border-block-start: 1px solid var(--gw-line); }
  .def-foot p { color: var(--gw-quiet); font-size: 0.9375rem; }
  .def-count wa-icon { display: none; }
  .def-count.is-done wa-icon { display: inline-flex; }

  @media (max-width: 600px) {
    .def { padding: 14px 16px 16px; }
    .def-term { font-size: 1.3125rem; }
  }
</style>
</head>
<body>
<section class="gw-block" aria-labelledby="def-term" data-gw-icons="check">
  <div class="def gw-hue-plum">
    <p class="def-label gw-eyebrow"><wa-icon name="bookmark"></wa-icon>Definition</p>
    <h2 class="def-term" id="def-term">Checklist</h2>
    <p class="def-text">A structured list of <button type="button" class="def-sub" data-term="item" aria-expanded="false" aria-controls="def-panel">items</button> to be confirmed, arranged in a defined <button type="button" class="def-sub" data-term="sequence" aria-expanded="false" aria-controls="def-panel">sequence</button>, so that nothing is overlooked.</p>
    <p class="def-more">A checklist can support planning, inspection, hand-over or review.</p>

    <div class="def-panel" id="def-panel" role="region" aria-labelledby="def-panel-title" hidden>
      <h3 id="def-panel-title" tabindex="-1"></h3>
      <p data-panel-text></p>
      <wa-button appearance="plain" variant="neutral" size="s" data-close><wa-icon name="x" label="Close explanation"></wa-icon></wa-button>
    </div>

    <div class="def-foot">
      <p>Select a highlighted term to see what it means.</p>
      <wa-badge class="def-count gw-counter" appearance="accent"><wa-icon slot="start" name="check"></wa-icon><span class="gw-num" data-seen>0</span>&nbsp;of&nbsp;<span class="gw-num" data-total>2</span>&nbsp;viewed</wa-badge>
    </div>
  </div>
  <p class="wa-visually-hidden" aria-live="polite" data-live></p>

  <template data-term="item"><h3>Item</h3><p>An item is a single point on the list that is confirmed, completed or marked as not applicable.</p></template>
  <template data-term="sequence"><h3>Sequence</h3><p>The sequence is the order in which items are checked. It may follow a process or group related items together.</p></template>
</section>

<script type="module">
  const block = document.querySelector('.gw-block');
  const triggers = [...block.querySelectorAll('.def-sub')];
  const panel = block.querySelector('#def-panel');
  const title = panel.querySelector('h3');
  const text = panel.querySelector('[data-panel-text]');
  const count = block.querySelector('.def-count');
  const live = block.querySelector('[data-live]');
  const seen = new Set();
  let open = null;
  block.querySelector('[data-total]').textContent = triggers.length;

  function show(id, moveFocus) {
    open = id;
    triggers.forEach(b => b.setAttribute('aria-expanded', String(b.dataset.term === id)));
    panel.hidden = !id;
    if (!id) return;
    const t = block.querySelector(`template[data-term="${id}"]`).content;
    title.textContent = t.querySelector('h3').textContent;
    text.textContent = t.querySelector('p').textContent;
    if (moveFocus) title.focus();
  }

  triggers.forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.term;
    if (open === id) { show(null); return; }
    show(id, true);
    seen.add(id);
    block.querySelector('[data-seen]').textContent = seen.size;
    if (seen.size === triggers.length) {
      count.classList.add('is-done');
      live.textContent = 'All terms viewed.';
      window.gwComplete();
    }
  }));

  panel.querySelector('[data-close]').addEventListener('click', () => {
    const last = open;
    show(null);
    block.querySelector(`.def-sub[data-term="${last}"]`)?.focus();
  });
  panel.addEventListener('keydown', e => { if (e.key === 'Escape' && open) panel.querySelector('[data-close]').click(); });
</script>
</body>
</html>
