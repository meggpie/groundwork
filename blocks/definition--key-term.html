<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Definition — Checklist</title>
<!--
  Library block: key-term definition (from Groundwork for Rise preset definition--key-term).
  The term is the heading; the marked words in the definition open a short explanation below.
  Completes when every marked word has been opened.
  To reuse: change the term and definition, and give each <button class="def-sub" data-term="id"> a matching
  <template data-term="id"> with its label and explanation.
  Pack for Rise: bun tools/pack.ts blocks/definition--key-term.html
-->
<style>
  wa-card.def { --spacing: var(--wa-space-xl); box-shadow: var(--wa-shadow-l); border-color: var(--wa-color-surface-border); }
  .def-label { display: flex; align-items: center; gap: var(--wa-space-xs); color: var(--wa-color-brand-40); }
  .def-label wa-icon { font-size: 18px; }
  .def-term { font-size: 2rem; letter-spacing: -0.03em; margin-block: var(--wa-space-xs) var(--wa-space-s); }
  .def-text { font-size: 1.125rem; max-width: 62ch; }
  .def-more { color: var(--wa-color-text-quiet); margin-block-start: var(--wa-space-s); max-width: 62ch; }

  /* Marked words: look like something to press, and say whether they're open. */
  .def-sub {
    font: inherit; font-weight: 700; color: var(--gw-dark-blue); background: var(--wa-color-brand-95);
    border: 0; border-radius: var(--wa-border-radius-s); padding: 0 0.2em; margin: 0 -0.05em; cursor: pointer;
    text-decoration: underline dotted; text-decoration-thickness: 2px; text-underline-offset: 4px;
    transition: background var(--wa-transition-normal) var(--wa-transition-easing);
  }
  .def-sub:hover { background: var(--wa-color-brand-90); }
  .def-sub[aria-expanded="true"] { background: var(--gw-dark-blue); color: var(--gw-white); text-decoration: none; }
  .def-sub.is-seen:not([aria-expanded="true"]) { text-decoration-style: solid; }

  .def-panel { margin-block-start: var(--wa-space-l); background: var(--gw-ice); border-radius: var(--wa-border-radius-m); padding: var(--wa-space-m) var(--wa-space-l); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--wa-space-xs) var(--wa-space-m); align-items: start; }
  .def-panel[hidden] { display: none; }
  .def-panel h3 { font-size: 1.125rem; outline: none; }
  .def-panel p { grid-column: 1; }
  .def-panel wa-button { grid-row: 1 / span 2; grid-column: 2; margin: -6px -10px 0 0; }

  .def-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--wa-space-m); margin-block-start: var(--wa-space-l); padding-block-start: var(--wa-space-m); border-block-start: 1px solid var(--wa-color-surface-border); }
  .def-foot p { color: var(--wa-color-text-quiet); font-size: 0.9375rem; }
  .def-count { flex: none; }
  .def-count wa-icon { display: none; }
  .def-count[variant="success"] wa-icon { display: inline-flex; }

  @media (max-width: 600px) {
    wa-card.def { --spacing: var(--wa-space-l); }
    .def-term { font-size: 1.625rem; }
    .def-text { font-size: 1.0625rem; }
    .def-panel { padding: var(--wa-space-m); }
    .def-foot { flex-direction: column; align-items: start; }
  }
</style>
</head>
<body>
<section class="gw-block" aria-labelledby="def-term">
  <wa-card class="def">
    <p class="def-label gw-eyebrow"><wa-icon name="bookmark"></wa-icon>Definition</p>
    <h2 class="def-term" id="def-term">Checklist</h2>
    <p class="def-text">A structured list of <button type="button" class="def-sub" data-term="item" aria-expanded="false" aria-controls="def-panel">items</button> to be confirmed, arranged in a defined <button type="button" class="def-sub" data-term="sequence" aria-expanded="false" aria-controls="def-panel">sequence</button>, so that nothing is overlooked.</p>
    <p class="def-more">A checklist can support planning, inspection, hand-over or review.</p>

    <div class="def-panel" id="def-panel" role="region" aria-labelledby="def-panel-title" hidden>
      <h3 id="def-panel-title" tabindex="-1"></h3>
      <p data-panel-text></p>
      <wa-button appearance="plain" variant="neutral" size="s" data-close><wa-icon name="x" label="Close explanation"></wa-icon></wa-button>
    </div>

    <div class="def-foot">
      <p>Select a highlighted term to see what it means.</p>
      <wa-badge class="def-count" variant="neutral" appearance="filled" pill><wa-icon slot="start" name="check"></wa-icon><span class="gw-num" data-seen>0</span>&nbsp;of&nbsp;<span class="gw-num" data-total>2</span>&nbsp;viewed</wa-badge>
    </div>
  </wa-card>
  <p class="wa-visually-hidden" aria-live="polite" data-live></p>

  <template data-term="item"><h3>Item</h3><p>An item is a single point on the list that is confirmed, completed or marked as not applicable.</p></template>
  <template data-term="sequence"><h3>Sequence</h3><p>The sequence is the order in which items are checked. It may follow a process or group related items together.</p></template>
</section>

<script type="module">
  const block = document.querySelector('.gw-block');
  const triggers = [...block.querySelectorAll('.def-sub')];
  const panel = block.querySelector('#def-panel');
  const title = panel.querySelector('h3');
  const text = panel.querySelector('[data-panel-text]');
  const count = block.querySelector('.def-count');
  const live = block.querySelector('[data-live]');
  const seen = new Set();
  let open = null;
  block.querySelector('[data-total]').textContent = triggers.length;

  function show(id, moveFocus) {
    open = id;
    triggers.forEach(b => b.setAttribute('aria-expanded', String(b.dataset.term === id)));
    panel.hidden = !id;
    if (!id) return;
    const t = block.querySelector(`template[data-term="${id}"]`).content;
    title.textContent = t.querySelector('h3').textContent;
    text.textContent = t.querySelector('p').textContent;
    if (moveFocus) title.focus();
  }

  triggers.forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.term;
    if (open === id) { show(null); return; }
    show(id, true);
    seen.add(id);
    b.classList.add('is-seen');
    block.querySelector('[data-seen]').textContent = seen.size;
    if (seen.size === triggers.length) {
      count.variant = 'success';
      live.textContent = 'All terms viewed.';
      window.gwComplete();
    }
  }));

  panel.querySelector('[data-close]').addEventListener('click', () => {
    const last = open;
    show(null);
    block.querySelector(`.def-sub[data-term="${last}"]`)?.focus();
  });
  panel.addEventListener('keydown', e => { if (e.key === 'Escape' && open) panel.querySelector('[data-close]').click(); });
</script>
</body>
</html>
