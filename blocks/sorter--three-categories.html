<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorter — three categories</title>
<!--
  Sorter: each statement gets one choice per category (two to four categories).
  Rebuilt on Web Awesome from Groundwork for Rise preset sorter--three-categories.
  Behaviour: Check answers is enabled once every statement has a choice; correct rows lock;
  wrong rows show their "why" and can be tried again; completes (gwComplete) when every row is correct.
  Edit the content in the JSON below. Pack for Rise: bun tools/pack.ts blocks/sorter--three-categories.html
-->
<style>
  /* Contained activity: a white card with a soft edge and shadow, sitting on an ice section. */
  wa-card.st { --spacing: var(--wa-space-l); border-color: var(--gw-border); box-shadow: var(--wa-shadow-l); }
  wa-card.st::part(body) { padding: 18px 20px 20px; }
  .st-head { display: flex; align-items: center; justify-content: space-between; gap: var(--wa-space-s) var(--wa-space-m); flex-wrap: wrap; margin-block-end: 12px; }
  .st-label { display: inline-flex; align-items: center; gap: 8px; margin: 0; color: var(--gw-ink); }
  .st-label wa-icon { font-size: 1.125rem; }
  .st h2 { font-size: 1.25rem; line-height: 1.3; }
  .st-hint { color: var(--wa-color-text-quiet); margin-block: 2px 12px; }

  /* Categories: each carries its own hue, shown as a dot on its choice, so learners can scan by category */
  .st-dot { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--hue); }

  .st-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .st-row { display: grid; gap: 8px; padding: 10px 12px; border-radius: var(--wa-border-radius-m); background: var(--gw-grey); transition: background-color var(--wa-transition-normal); }
  .st-text { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; line-height: 1.45; margin: 0; font-weight: 700; }
  .st-n { flex: none; font-size: 0.875rem; color: var(--wa-color-text-quiet); font-weight: 500; }
  .st-mark { display: inline-flex; align-items: center; gap: 6px; margin-inline-start: auto; font-weight: 700; font-size: 0.9375rem; white-space: nowrap; }
  .st-mark:empty { display: none; }
  .st-row.is-ok { background: var(--gw-correct-fill); }
  .st-row.is-no { background: var(--gw-wrong-fill); }
  .st-row.is-ok .st-mark { color: var(--gw-correct); }
  .st-row.is-no .st-mark { color: var(--gw-wrong); }

  /* Choices: rounded pill buttons (Web Awesome button radios) */
  .st-choice::part(form-control-label) { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .st-choice::part(form-control-input) { gap: 8px; flex-wrap: wrap; }
  .st-choice wa-radio[appearance="button"] {
    flex: 1 1 0; min-width: 0; min-height: 40px; justify-content: center; text-align: center;
    border: 1px solid var(--gw-border); border-radius: 999px; background: var(--gw-white); color: var(--gw-ink); font-weight: 700;
  }
  .st-choice wa-radio[appearance="button"]::part(label) { display: inline-flex; align-items: center; gap: 8px; }
  .st-choice wa-radio:hover:not([aria-checked="true"]):not([disabled]) { border-color: var(--wa-color-neutral-border-loud); }
  .st-choice wa-radio[aria-checked="true"] { background: var(--gw-blue-tint); border-color: var(--gw-dark-blue); box-shadow: inset 0 0 0 1px var(--gw-dark-blue); color: var(--gw-dark-blue); }
  .st-choice wa-radio:focus-visible { outline: var(--wa-focus-ring); outline-offset: 2px; }
  .st-choice wa-radio[disabled] { opacity: 1; cursor: default; }
  .st-choice wa-radio[disabled]:not([aria-checked="true"]) { color: var(--wa-color-text-quiet); }
  .st-row.is-ok wa-radio[aria-checked="true"] { background: var(--gw-white); border-color: var(--gw-correct); box-shadow: inset 0 0 0 1px var(--gw-correct); color: var(--gw-correct); }
  .st-row.is-no wa-radio[aria-checked="true"] { background: var(--gw-white); border-color: var(--gw-wrong); box-shadow: inset 0 0 0 1px var(--gw-wrong); color: var(--gw-wrong); }

  /* Feedback */
  wa-callout.gw-fb { border-radius: var(--wa-border-radius-m); outline: none; }
  wa-callout.gw-fb p { color: var(--gw-ink); }
  .gw-fb-h { font-weight: 700; margin-block-end: 2px; }
  .st-why { color: var(--gw-ink); margin: 0; }
  .st-why strong { color: var(--gw-wrong); }
  .st-summary:not(:empty) { margin-block-start: 12px; }
  .st-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-block-start: 14px; }

  @media (max-width: 600px) {
    wa-card.st::part(body) { padding: 16px; }
    .st h2 { font-size: 1.1875rem; }
    .st-row { padding: 10px; }
    .st-choice wa-radio[appearance="button"] { flex-basis: 100%; }
  }
</style>
</head>
<body>
<section class="gw-block" aria-label="Sort it"
  data-gw-components="radio-group radio callout button badge" data-gw-icons="check x rotate-ccw circle-check info">
  <wa-card class="st">
    <div class="st-head">
      <p class="st-label gw-eyebrow"><wa-icon name="arrow-down-up"></wa-icon><span data-label>Sort it</span></p>
      <wa-badge class="gw-counter" appearance="accent" data-count></wa-badge>
    </div>
    <h2 data-instruction></h2>
    <p class="st-hint" data-hint></p>
    <ol class="st-rows" data-rows></ol>
    <div class="st-summary" role="status" aria-live="polite" data-summary></div>
    <div class="st-actions" data-actions></div>
  </wa-card>
</section>

<script type="application/json" id="st-data">
{
  "label": "Sort it",
  "instruction": "Choose the category that best matches each statement.",
  "hint": "Choose one for each statement.",
  "categories": ["Requirements", "Implementation", "Maintenance"],
  "items": [
    { "text": "Technical provisions in a code", "answer": "Requirements", "why": "Provisions are what the code requires, so they are requirements." },
    { "text": "Carrying out approved work", "answer": "Implementation", "why": "Doing the approved work is implementation." },
    { "text": "Keeping a system working over time", "answer": "Maintenance", "why": "Ongoing upkeep is maintenance." }
  ]
}
</script>

<script type="module">
  const d = JSON.parse(document.getElementById('st-data').textContent);
  const block = document.querySelector('.gw-block');
  const $ = s => block.querySelector(s);
  const el = (tag, attrs = {}, html = '') => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); e.innerHTML = html; return e; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const cats = d.categories.slice(0, 4), items = d.items;
  const narrow = matchMedia('(max-width: 600px)');
  const hues = ['gw-hue-cobalt', 'gw-hue-coral', 'gw-hue-plum', 'gw-hue-jade'];

  $('[data-label]').textContent = d.label || 'Sort it';
  block.setAttribute('aria-label', d.label || 'Sort it');
  $('[data-instruction]').textContent = d.instruction;
  $('[data-hint]').textContent = d.hint || 'Choose one for each statement.';

  const rows = items.map((item, i) => {
    const li = el('li', { class: 'st-row' });
    const text = el('p', { class: 'st-text', id: `st-t${i}` }, `<span class="st-n gw-num" aria-hidden="true">${String(i + 1).padStart(2, '0')}</span><span>${esc(item.text)}<span class="st-mark" data-mark></span></span>`);
    const group = el('wa-radio-group', { class: 'st-choice', label: item.text, name: `st-${i}`, orientation: 'horizontal' });
    cats.forEach((c, k) => group.append(el('wa-radio', { appearance: 'button', value: c, class: hues[k] }, `<span class="st-dot" aria-hidden="true"></span>${esc(c)}`)));
    li.append(text, group);
    $('[data-rows]').append(li);
    group.addEventListener('change', update);
    return { li, group, item, locked: false };
  });

  const count = $('[data-count]'), summary = $('[data-summary]'), actions = $('[data-actions]');
  const check = el('wa-button', { variant: 'brand', disabled: '' }, 'Check answers');
  const retry = el('wa-button', { variant: 'neutral', appearance: 'outlined' }, '<wa-icon slot="start" name="rotate-ccw"></wa-icon>Try again');
  actions.append(check);

  function update() {
    const left = rows.filter(r => !r.group.value).length;
    count.innerHTML = left ? `<span class="gw-num">${left}</span>&nbsp;left` : 'All placed';
    check.disabled = left > 0;
  }

  check.addEventListener('click', () => {
    rows.forEach(r => {
      if (r.locked) return;
      const ok = r.group.value === r.item.answer;
      r.locked = ok;
      r.li.classList.add(ok ? 'is-ok' : 'is-no');
      r.group.querySelectorAll('wa-radio').forEach(x => x.disabled = true);
      const mark = r.li.querySelector('[data-mark]');
      mark.innerHTML = `<wa-icon></wa-icon>${ok ? 'Correct' : 'Not quite'}`;
      mark.querySelector('wa-icon').setAttribute('name', ok ? 'check' : 'x');
      if (!ok && r.item.why) r.li.append(el('p', { class: 'st-why' }, `<strong>Why:</strong> ${esc(r.item.why)}`));
    });
    const right = rows.filter(r => r.locked).length, all = right === rows.length;
    const msg = el('wa-callout', { class: 'gw-fb', variant: all ? 'success' : 'neutral', appearance: 'filled', tabindex: '-1' },
      `<wa-icon slot="icon"></wa-icon><p class="gw-fb-h">${right} of ${rows.length} correct</p><p>${all ? 'Every statement is in the right category.' : 'Try the others again.'}</p>`);
    msg.querySelector('wa-icon').setAttribute('name', all ? 'circle-check' : 'info');
    summary.replaceChildren(msg);
    actions.replaceChildren(...(all ? [] : [retry]));
    if (all) {
      count.innerHTML = `<span class="gw-num">${right}</span>&nbsp;of&nbsp;<span class="gw-num">${rows.length}</span>&nbsp;correct`;
      count.classList.add('is-done');
      setTimeout(() => msg.focus(), 50);
      window.gwComplete();
    } else {
      count.innerHTML = `<span class="gw-num">${right}</span>&nbsp;of&nbsp;<span class="gw-num">${rows.length}</span>&nbsp;correct`;
      setTimeout(() => retry.focus(), 50);
    }
  });

  retry.addEventListener('click', () => {
    rows.forEach(r => {
      if (r.locked) return;
      r.li.classList.remove('is-no');
      r.li.querySelector('[data-mark]').innerHTML = '';
      r.li.querySelector('.st-why')?.remove();
      r.group.value = null;
      r.group.querySelectorAll('wa-radio').forEach(x => x.disabled = false);
    });
    summary.replaceChildren();
    actions.replaceChildren(check);
    update();
    setTimeout(() => rows.find(r => !r.locked)?.group.querySelector('wa-radio')?.focus(), 50);
  });

  update();
</script>
</body>
</html>
