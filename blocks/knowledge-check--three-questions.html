<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge check — three questions</title>
<!--
  Knowledge check: one to five single-choice questions, one at a time.
  Rebuilt on Web Awesome from Groundwork for Rise preset knowledge-check--three-questions.
  Behaviour: wrong answer → feedback + Try again; right answer → feedback + Next question;
  progress fills per question answered correctly; completes (gwComplete) when every question is answered correctly.
  Edit the questions in the JSON below. Pack for Rise: bun tools/pack.ts blocks/knowledge-check--three-questions.html
-->
<style>
  /* Groundwork "do" block: white card, 1px outline, on an ice section. */
  wa-card.kc { --spacing: var(--wa-space-l); border-color: var(--gw-border); }
  wa-card.kc::part(body) { padding: 28px 32px 32px; }
  .kc-head { display: flex; flex-direction: column; gap: var(--wa-space-l); margin-block-end: var(--wa-space-l); }
  /* Label: 36px ink tile with a white icon, then an 18px capitalised label */
  .kc-label { display: flex; align-items: center; gap: 16px; font: 700 1.125rem/1.2 var(--wa-font-family-heading); letter-spacing: 0.06em; text-transform: uppercase; color: var(--gw-ink); margin: 0; }
  .kc-tile { flex: none; display: grid; place-items: center; width: 36px; height: 36px; background: var(--gw-ink); color: var(--gw-white); font-size: 20px; }
  /* Progress: one segment per question, each filling with the next order-run colour */
  .kc-progress { display: flex; gap: 6px; }
  .kc-progress span { flex: 1; height: 10px; background: var(--gw-white); box-shadow: inset 0 0 0 1px var(--gw-line); }
  .kc-progress span.on { box-shadow: none; }
  .kc-progress span.on:nth-child(1) { background: var(--gw-run-1); }
  .kc-progress span.on:nth-child(2) { background: var(--gw-run-2); }
  .kc-progress span.on:nth-child(3) { background: var(--gw-run-3); }
  .kc-progress span.on:nth-child(4) { background: var(--gw-run-4); }
  .kc-progress span.on:nth-child(5) { background: var(--gw-run-5); }
  .kc-qhead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font: 700 1.25rem/1.25 var(--wa-font-family-heading); margin: 0; }
  .kc h2 { font-size: 1.375rem; line-height: 1.3; outline: none; }
  .kc-qhead + h2 { margin-block-start: var(--wa-space-m); }
  .kc-hint { margin-block: var(--wa-space-s) var(--wa-space-l); }

  /* Answers: each radio is a full-width option row */
  .kc-opts::part(form-control-label) { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .kc-opts::part(form-control-input) { gap: 12px; }
  wa-radio.kc-opt {
    display: flex; align-items: flex-start; width: 100%; margin: 0; gap: 16px;
    padding: 16px 18px; border: 1px solid var(--gw-border); background: var(--gw-white); font-size: 1.0625rem; line-height: 1.5;
    --checked-icon-color: var(--gw-ink);
  }
  wa-radio.kc-opt::part(control) { width: 24px; height: 24px; margin-block-start: 1px; border-color: var(--gw-ink); }
  wa-radio.kc-opt::part(label) { display: flex; align-items: flex-start; gap: 16px; width: 100%; margin: 0; }
  wa-radio.kc-opt:hover:not([aria-checked="true"]):not([disabled]) { background: var(--gw-grey); }
  /* Chosen, before checking: gold tint with a 2px deep-gold outline (inset so nothing shifts) */
  wa-radio.kc-opt[aria-checked="true"] { background: var(--gw-gold-tint); border-color: var(--gw-gold-deep); box-shadow: inset 0 0 0 1px var(--gw-gold-deep); }
  wa-radio.kc-opt:focus-visible { outline: var(--wa-focus-ring); outline-offset: 2px; }
  .kc-letter { flex: none; font-size: 1rem; line-height: 1.5rem; }
  .kc-text { flex: 1; min-width: 0; }
  /* After checking: correct / wrong, always with a mark and words */
  wa-radio.kc-opt[disabled] { opacity: 1; cursor: default; }
  wa-radio.kc-opt.is-ok { background: var(--gw-correct-fill); border-color: var(--gw-correct); box-shadow: inset 0 0 0 1px var(--gw-correct); }
  wa-radio.kc-opt.is-no { background: var(--gw-wrong-fill); border-color: var(--gw-wrong); box-shadow: inset 0 0 0 1px var(--gw-wrong); }
  .kc-mark { flex: none; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.9375rem; }
  .kc-mark i { display: inline-grid; place-items: center; width: 24px; height: 24px; color: var(--gw-white); font-size: 15px; font-style: normal; }
  .is-ok .kc-mark { color: var(--gw-correct); } .is-ok .kc-mark i { background: var(--gw-correct); }
  .is-no .kc-mark { color: var(--gw-wrong); }   .is-no .kc-mark i { background: var(--gw-wrong); }

  /* Feedback: a 4px coloured rule, a coloured heading, then the explanation in ink */
  .kc-feedback:empty { display: none; }
  .kc-feedback { margin-block-start: var(--wa-space-l); }
  wa-callout.gw-fb { background: transparent; border: 0; border-inline-start: 4px solid var(--wa-color-border-loud); padding: 4px 0 4px 18px; outline: none; }
  .gw-fb-h { display: flex; align-items: center; gap: 10px; font: 700 1.1875rem/1.3 var(--wa-font-family-heading); color: var(--wa-color-on-quiet); margin-block-end: 6px; }
  .kc-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--wa-space-s); margin-block-start: var(--wa-space-l); }
  wa-button[disabled]::part(button) { background: var(--gw-disabled); border-color: var(--gw-disabled); color: var(--gw-muted); opacity: 1; }
  .kc-done { display: inline-flex; align-items: center; gap: var(--wa-space-xs); font-weight: 700; outline: none; }

  @media (max-width: 600px) {
    wa-card.kc::part(body) { padding: 22px 20px 24px; }
    .kc h2 { font-size: 1.25rem; }
    wa-radio.kc-opt { padding: 14px; }
  }
</style>
</head>
<body>
<section class="gw-block" aria-label="Knowledge check"
  data-gw-components="radio-group radio callout button badge" data-gw-icons="check x arrow-right rotate-ccw circle-check circle-x">
  <wa-card class="kc">
    <div class="kc-head">
      <p class="kc-label"><span class="kc-tile" aria-hidden="true"><wa-icon name="square-check"></wa-icon></span><span data-label>Knowledge check</span></p>
      <div class="kc-progress" role="progressbar" aria-label="Questions answered correctly" aria-valuemin="0" aria-valuenow="0" hidden data-progress></div>
    </div>
    <p class="kc-qhead" hidden data-qhead>Question <wa-badge class="gw-counter" appearance="accent"><span class="gw-num" data-n>1</span>&nbsp;of&nbsp;<span class="gw-num" data-total>3</span></wa-badge></p>
    <div data-question></div>
  </wa-card>
</section>

<script type="application/json" id="kc-data">
{
  "label": "Knowledge check",
  "questions": [
    {
      "question": "Which action helps confirm that a requirement was met?",
      "answers": [
        { "text": "Reviewing the work against its requirements", "correct": true, "feedback": "Checking the work against the requirements provides evidence of compliance." },
        { "text": "Assuming earlier work was correct", "correct": false, "feedback": "Assumptions do not verify compliance. Look for evidence." },
        { "text": "Skipping the final inspection", "correct": false, "feedback": "Skipping checks leaves the outcome unverified." }
      ]
    },
    {
      "question": "What does a minimum requirement set?",
      "answers": [
        { "text": "The best possible result", "correct": false, "feedback": "A minimum is a floor, not a target. Going further is allowed." },
        { "text": "The lowest acceptable level", "correct": true, "feedback": "Meeting it is the baseline; anything less does not comply." },
        { "text": "A suggestion that can be ignored", "correct": false, "feedback": "Once adopted, a requirement must be met." }
      ]
    },
    {
      "question": "Who is responsible for confirming that work complies?",
      "answers": [
        { "text": "Nobody, once the work is finished", "correct": false, "feedback": "Completed work still has to be verified." },
        { "text": "Only the person who designed it", "correct": false, "feedback": "Designers are one part of it; verification is shared." },
        { "text": "Whoever the process assigns to verify it", "correct": true, "feedback": "Each process names who checks the work and when." }
      ]
    }
  ]
}
</script>

<script type="module">
  const data = JSON.parse(document.getElementById('kc-data').textContent);
  const qs = data.questions.slice(0, 5);
  const block = document.querySelector('.gw-block');
  const host = block.querySelector('[data-question]');
  const qhead = block.querySelector('[data-qhead]');
  const bar = block.querySelector('[data-progress]');
  const multi = qs.length > 1;
  block.querySelector('[data-label]').textContent = data.label || 'Knowledge check';
  block.setAttribute('aria-label', data.label || 'Knowledge check');
  block.querySelector('[data-total]').textContent = qs.length;
  qhead.hidden = bar.hidden = !multi;
  bar.setAttribute('aria-valuemax', qs.length);
  bar.innerHTML = qs.map(() => '<span></span>').join('');
  let idx = 0, correct = 0;

  const el = (tag, attrs = {}, html = '') => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); e.innerHTML = html; return e; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function draw(focusQuestion) {
    const q = qs[idx];
    block.querySelector('[data-n]').textContent = idx + 1;
    host.innerHTML = '';
    const h = el('h2', { id: 'kc-q', tabindex: '-1' }, esc(q.question));
    const hint = el('p', { class: 'kc-hint' }, esc(q.hint || data.hint || 'Select one answer.'));
    const group = el('wa-radio-group', { class: 'kc-opts', label: q.question, name: 'kc-answer' });
    q.answers.forEach((a, i) => group.append(el('wa-radio', { class: 'kc-opt', value: String(i) },
      `<span class="kc-letter gw-num" aria-hidden="true">${'ABCDE'[i]}</span><span class="kc-text">${esc(a.text)}</span><span class="kc-mark" data-mark></span>`)));
    const feedback = el('div', { class: 'kc-feedback', role: 'status', 'aria-live': 'polite' });
    const actions = el('div', { class: 'kc-actions' });
    const check = el('wa-button', { variant: 'brand', disabled: '' }, 'Check answer');
    actions.append(check);
    host.append(h, hint, group, feedback, actions);

    group.addEventListener('change', () => { check.disabled = !group.value; });
    check.addEventListener('click', () => {
      if (!group.value) return;
      const i = Number(group.value), a = q.answers[i], ok = a.correct === true;
      const opt = group.querySelectorAll('wa-radio')[i];
      group.querySelectorAll('wa-radio').forEach(r => r.disabled = true);
      opt.classList.add(ok ? 'is-ok' : 'is-no');
      const mark = opt.querySelector('[data-mark]');
      mark.innerHTML = `<i aria-hidden="true"><wa-icon></wa-icon></i>${ok ? 'Correct' : 'Not this one'}`;
      mark.querySelector('wa-icon').setAttribute('name', ok ? 'check' : 'x');
      const callout = el('wa-callout', { class: 'gw-fb', variant: ok ? 'success' : 'danger', appearance: 'plain' },
        `<p class="gw-fb-h"><wa-icon></wa-icon>${ok ? 'Correct' : 'Not quite'}</p><p>${esc(a.feedback || (ok ? 'That’s right.' : 'Review the options and try again.'))}</p>`);
      callout.querySelector('wa-icon').setAttribute('name', ok ? 'circle-check' : 'circle-x');
      feedback.replaceChildren(callout);
      actions.innerHTML = '';
      if (!ok) {
        const retry = el('wa-button', { variant: 'neutral', appearance: 'outlined' }, '<wa-icon slot="start" name="rotate-ccw"></wa-icon>Try again');
        retry.addEventListener('click', () => { draw(); setTimeout(() => host.querySelector('wa-radio')?.focus(), 50); });
        actions.append(retry); setTimeout(() => retry.focus(), 50);
        return;
      }
      correct = Math.max(correct, idx + 1);
      bar.querySelectorAll('span').forEach((seg, k) => seg.classList.toggle('on', k < correct));
      bar.setAttribute('aria-valuenow', correct);
      if (idx < qs.length - 1) {
        const next = el('wa-button', { variant: 'brand' }, 'Next question<wa-icon slot="end" name="arrow-right"></wa-icon>');
        next.addEventListener('click', () => { idx++; draw(true); });
        actions.append(next); setTimeout(() => next.focus(), 50);
      } else {
        const done = el('p', { class: 'kc-done', tabindex: '-1' }, `<wa-icon name="check"></wa-icon>${multi ? 'All questions answered.' : 'Question answered.'}`);
        actions.append(done); setTimeout(() => done.focus(), 50);
        window.gwComplete();
      }
    });
    if (focusQuestion) setTimeout(() => h.focus(), 50);
  }
  draw();
</script>
</body>
</html>
