<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key takeaway — card</title>
<!--
  Groundwork block: key takeaway. One short statement the learner should remember from the section.
  Gold top bar is its accent (the only content block where gold is an accent). Works on white or ice sections.
  Source preset: groundwork-for-rise library/presets/key-takeaway--card.json
  Static: no completion.
  Pack for Rise: bun tools/pack.ts blocks/key-takeaway--card.html
-->
<style>
  /* White card, 1px outline, 6px gold top bar; ink mark with no tile; text a step above body. */
  wa-card.kt { --spacing: var(--wa-space-l) var(--wa-space-xl) var(--wa-space-l); border-top: 6px solid var(--gw-gold); }
  .kt-body { display: grid; gap: var(--wa-space-s); }
  .kt-label { display: flex; align-items: center; gap: var(--wa-space-s); }
  .kt-label wa-icon { font-size: 28px; color: var(--gw-ink); }
  .kt-text { font-family: var(--wa-font-family-heading); font-weight: 700; font-size: 1.125rem; line-height: 1.4; letter-spacing: -0.005em; color: var(--gw-ink); max-width: 66ch; }

  @media (max-width: 600px) {
    wa-card.kt { --spacing: var(--wa-space-m) var(--wa-space-l) var(--wa-space-l); }
    .kt-text { font-size: 1.0625rem; }
  }
</style>
</head>
<body>
<section class="gw-block">
  <wa-card class="kt">
    <div class="kt-body">
      <p class="gw-eyebrow kt-label"><wa-icon name="lightbulb"></wa-icon>Key takeaway</p>
      <p class="kt-text">One or two sentences that state the idea the learner should remember from this section.</p>
    </div>
  </wa-card>
</section>
</body>
</html>
