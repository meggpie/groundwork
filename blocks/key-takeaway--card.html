<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key takeaway — card</title>
<!--
  Groundwork block: key takeaway. One short statement the learner should remember from the section.
  The one content block where gold leads (DESIGN.md: gold marks what matters most). Works on white or ice sections.
  Source preset: groundwork-for-rise library/presets/key-takeaway--card.json. Static: no completion.
  Pack for Rise: bun tools/pack.ts blocks/key-takeaway--card.html
-->
<style>
  wa-card.kt { --spacing: 16px 20px; box-shadow: var(--wa-shadow-l); }
  .kt-body { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 14px; align-items: start; }
  .kt-mark { grid-row: 1 / span 2; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--gw-gold); color: var(--gw-ink); font-size: 22px; }
  .kt-label { color: var(--wa-color-warning-30); margin-block-start: 1px; }
  .kt-text { font-family: var(--wa-font-family-heading); font-weight: 700; font-size: 1.1875rem; line-height: 1.35; letter-spacing: -0.015em; color: var(--gw-ink); max-width: 62ch; text-wrap: pretty; }
  @media (max-width: 600px) {
    wa-card.kt { --spacing: 14px 16px; }
    .kt-body { column-gap: 12px; }
    .kt-mark { width: 40px; height: 40px; font-size: 20px; }
    .kt-text { font-size: 1.0625rem; }
  }
</style>
</head>
<body>
<section class="gw-block">
  <wa-card class="kt">
    <div class="kt-body">
      <span class="kt-mark" aria-hidden="true"><wa-icon name="lightbulb"></wa-icon></span>
      <p class="gw-eyebrow kt-label">Key takeaway</p>
      <p class="kt-text">One or two sentences that state the idea the learner should remember from this section.</p>
    </div>
  </wa-card>
</section>
</body>
</html>
