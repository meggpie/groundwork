<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worked example — A change during construction</title>
<!--
  Library block: worked example, situation then explanation (from Groundwork for Rise preset
  worked-example--situation-explanation). Groundwork look: white card with a 1px outline; the situation
  (teal icon, heading, text) above, "How this connects" below on ice. Static.
  Pack for Rise: bun tools/pack.ts blocks/worked-example--situation-explanation.html
-->
<style>
  /* White card, 1px outline: the situation above (teal icon + heading), the connection below on ice. */
  .we { background: var(--gw-white); border: 1px solid var(--gw-border); }
  .we-upper { padding: 26px 30px; }
  .we-heading { display: flex; align-items: center; gap: 14px; margin-block-end: 12px; }
  .we-heading wa-icon { font-size: 36px; color: var(--gw-teal); flex: none; }
  .we-heading h2 { font-size: 1.375rem; }
  .we-lower { background: var(--gw-ice); padding: 22px 30px 26px; }
  .we-lower h3 { font-size: 1.125rem; margin-block-end: 8px; }
  @media (max-width: 600px) { .we-upper, .we-lower { padding: 20px; } }
</style>
</head>
<body>
<section class="gw-block">
  <article class="we" aria-labelledby="we-title">
    <div class="we-upper">
      <div class="we-heading"><wa-icon name="building"></wa-icon><h2 id="we-title">A change during construction</h2></div>
      <p>A project team discovers that a proposed material differs from the approved drawings.</p>
    </div>
    <div class="we-lower">
      <h3>How this connects</h3>
      <p>The team needs to establish which requirements apply and follow the appropriate process before proceeding.</p>
    </div>
  </article>
</section>
</body>
</html>
