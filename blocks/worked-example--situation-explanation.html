<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worked example — A change during construction</title>
<!--
  Library block: worked example, situation then explanation (from Groundwork for Rise preset
  worked-example--situation-explanation). Direction from experiments/02-worked-example.html:
  a dark blue situation panel, then the reasoning beneath it with a gold rule. Static.
  For a longer example, add numbered reasoning steps between the two (see the experiment).
  Pack for Rise: bun tools/pack.ts blocks/worked-example--situation-explanation.html
-->
<style>
  wa-card.we { --spacing: var(--wa-space-l); box-shadow: var(--wa-shadow-l); border-color: var(--wa-color-surface-border); }
  .we-situation { background: var(--gw-dark-blue); color: var(--gw-white); border-radius: var(--wa-border-radius-m); padding: var(--wa-space-l) var(--wa-space-xl); display: grid; gap: var(--wa-space-xs); }
  .we-situation .gw-eyebrow { color: var(--wa-color-brand-90); }
  .we-situation h2 { color: var(--gw-white); font-size: 1.5rem; }
  .we-situation p:last-child { max-width: 62ch; font-size: 1.0625rem; }
  .we-explain { margin: var(--wa-space-l) var(--wa-space-xl) var(--wa-space-xs); padding-inline-start: var(--wa-space-m); border-inline-start: 3px solid var(--gw-gold); display: grid; gap: var(--wa-space-2xs); }
  .we-explain h3 { font-size: 1.125rem; }
  .we-explain p { max-width: 62ch; }

  @media (max-width: 600px) {
    wa-card.we { --spacing: var(--wa-space-s); }
    .we-situation { padding: var(--wa-space-m) var(--wa-space-l); }
    .we-situation h2 { font-size: 1.3125rem; }
    .we-explain { margin: var(--wa-space-m) var(--wa-space-s) var(--wa-space-xs); }
  }
</style>
</head>
<body>
<section class="gw-block">
  <wa-card class="we">
    <article aria-labelledby="we-title">
      <header class="we-situation">
        <p class="gw-eyebrow">Worked example · Situation</p>
        <h2 id="we-title">A change during construction</h2>
        <p>A project team discovers that a proposed material differs from the approved drawings.</p>
      </header>
      <div class="we-explain">
        <h3>How this connects</h3>
        <p>The team needs to establish which requirements apply and follow the appropriate process before proceeding.</p>
      </div>
    </article>
  </wa-card>
</section>
</body>
</html>
