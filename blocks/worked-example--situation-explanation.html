<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worked example — A change during construction</title>
<!--
  Library block: worked example (from Groundwork for Rise preset worked-example--situation-explanation).
  Follows the reviewed trial experiments/02-worked-example.html: a dark-blue situation panel, optional numbered
  reasoning steps, then the conclusion with a gold rule.
  Optional steps: add between the panel and the conclusion
    <ol class="we-steps"><li><h3>Step title</h3><p>Step text.</p></li>…</ol>
  Static block: no completion.
  Pack for Rise: bun tools/pack.ts blocks/worked-example--situation-explanation.html
-->
<style>
  .we { display: grid; gap: var(--wa-space-s); }
  .we-situation { background: var(--gw-dark-blue); color: var(--gw-white); border-radius: var(--wa-border-radius-l); box-shadow: var(--wa-shadow-m); padding: 18px 24px 20px; }
  .we-situation .gw-eyebrow { color: var(--gw-header-label); font-size: 0.75rem; letter-spacing: 0.12em; }
  .we-situation h2 { color: var(--gw-white); font-size: 1.4375rem; letter-spacing: -0.03em; margin-block: 6px 8px; }
  .we-situation p { max-width: 50em; }

  .we-steps { list-style: none; margin: 0; padding: 4px 24px 0; counter-reset: we; }
  .we-steps li { display: grid; grid-template-columns: 35px minmax(0, 1fr); column-gap: 14px; padding-block: 14px; }
  .we-steps li + li { border-block-start: 1px solid var(--gw-line); }
  .we-steps li::before { counter-increment: we; content: '0' counter(we); grid-row: 1 / span 2; font: 500 0.875rem/30px var(--wa-font-family-code); color: var(--gw-dark-blue); }
  .we-steps h3 { font-size: 1.125rem; margin-block: 3px 5px; }

  .we-answer { margin: 6px 24px 0; padding: 6px 0 6px 16px; border-inline-start: 3px solid var(--gw-gold); }
  .we-answer h3 { font-size: 1.125rem; letter-spacing: -0.03em; margin-block-end: 6px; }

  @media (max-width: 600px) {
    .we-situation { padding: 18px 20px; }
    .we-situation h2 { font-size: 1.375rem; }
    .we-steps { padding-inline: 8px; }
    .we-steps li { grid-template-columns: 28px minmax(0, 1fr); column-gap: 8px; }
    .we-answer { margin-inline: 8px; padding-inline-start: 14px; }
  }
</style>
</head>
<body>
<section class="gw-block">
  <article class="we" aria-labelledby="we-title">
    <header class="we-situation">
      <span class="gw-eyebrow">Worked example · Situation</span>
      <h2 id="we-title">A change during construction</h2>
      <p>A project team discovers that a proposed material differs from the approved drawings.</p>
    </header>
    <div class="we-answer">
      <h3>How this connects</h3>
      <p>The team needs to establish which requirements apply and follow the appropriate process before proceeding.</p>
    </div>
  </article>
</section>
</body>
</html>
