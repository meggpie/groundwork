<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note</title>
<!--
  Library block: note (from Groundwork for Rise preset note--bordered).
  A compact aside: useful but not essential. Static. Optional title: add <h3 class="note-title"> after the label.
  Groundwork look: borderless ice card, teal info icon, 13px label. On an ice section use class="note is-white".
  Pack for Rise: bun tools/pack.ts blocks/note--bordered.html
-->
<style>
  /* Compact aside: borderless ice card with a teal info icon. On an ice section use class="note is-white". */
  .note { background: var(--gw-ice); padding: 16px 22px 18px; display: grid; gap: 6px; }
  .note.is-white { background: var(--gw-white); }
  .note-label { display: flex; align-items: center; gap: 7px; font-size: 0.8125rem; }
  .note-label wa-icon { font-size: 20px; color: var(--gw-teal); }
  .note-title { font-size: 1.25rem; }
  .note p:not(.note-label) { margin-block-start: 2px; }
</style>
</head>
<body>
<section class="gw-block">
  <aside class="note" aria-label="Note">
    <p class="note-label gw-eyebrow"><wa-icon name="info"></wa-icon>Note</p>
    <p>Extra information that is useful to know but not essential, such as a date, an exception or where to find more detail.</p>
  </aside>
</section>
</body>
</html>
