<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note</title>
<!--
  Library block: note (from Groundwork for Rise preset note--bordered).
  A compact, quiet aside: useful but not essential. It should read as secondary to the lesson text.
  Grey tint on white sections; on an ice section use class="note is-white".
  Optional title: add <h3 class="note-title">Title</h3> after the label.
  Static block: no completion.
  Pack for Rise: bun tools/pack.ts blocks/note--bordered.html
-->
<style>
  .note { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; row-gap: 4px; align-items: start;
    background: var(--gw-grey); border-radius: var(--wa-border-radius-m); padding: 14px 18px 16px; }
  .note.is-white { background: var(--gw-white); box-shadow: var(--wa-shadow-s); }
  .note > wa-icon { grid-row: 1 / span 3; font-size: 20px; color: var(--gw-quiet); margin-block-start: 1px; }
  .note .gw-eyebrow { color: var(--gw-quiet); font-size: 0.75rem; }
  .note-title { font-size: 1.0625rem; }
  .note p:not(.gw-eyebrow) { color: var(--gw-ink); font-size: 1rem; line-height: 1.5; }
</style>
</head>
<body>
<section class="gw-block">
  <aside class="note" aria-label="Note">
    <wa-icon name="info"></wa-icon>
    <p class="gw-eyebrow">Note</p>
    <p>Extra information that is useful to know but not essential, such as a date, an exception or where to find more detail.</p>
  </aside>
</section>
</body>
</html>
